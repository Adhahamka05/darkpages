<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE VOID | SEND A MESSAGE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="story-page-body">
    <div class="vignette"></div>
    
    <main class="story-reader">
        <a href="index.html" class="home-btn">← RETURN TO SAFETY</a>
        
        <h1 class="glitch" data-text="CONTACT THE VOID">CONTACT THE VOID</h1>
        <p style="text-align: center; color: #555; margin-bottom: 30px;">Do not expect a reply in this life.</p>

        <form class="scary-form">
            <div class="input-group">
                <label>YOUR NAME / IDENTIFIER</label>
                <input type="text" placeholder="Who is speaking?">
            </div>

            <div class="input-group">
                <label>CHANNELING FREQUENCY (EMAIL)</label>
                <input type="email" placeholder="Where can the shadows find you?">
            </div>

            <div class="input-group">
                <label>THE MESSAGE</label>
                <textarea rows="6" placeholder="Whisper into the darkness..."></textarea>
            </div>

            <button type="button" class="read-btn" onclick="this.innerHTML='MESSAGE CONSUMED'">SEND INTO THE DARK</button>
        </form>

        <div class="social-links" style="margin-top: 40px; text-align: center;">
            <p style="color: #444; margin-bottom: 10px;">OTHER CONNECTIONS:</p>
            <a href="#" class="nav-item">INSTAGRAM</a>
            <a href="#" class="nav-item">X (TWITTER)</a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
